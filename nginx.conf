server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward IS3 frame API to Flask
    location ~ ^/(frame|info) {
        proxy_pass         http://api:5174;
        proxy_set_header   Host $host;
        proxy_read_timeout 15s;
    }

    # FAN inference can take a few seconds on CPU
    location /predict {
        proxy_pass         http://api:5174;
        proxy_set_header   Host $host;
        proxy_read_timeout 60s;
    }

    # React SPA — fall back to index.html for all unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
