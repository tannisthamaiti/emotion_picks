services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      # Named volume — IS3 files uploaded via the browser are persisted here
      - uploads:/data/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uploads:
