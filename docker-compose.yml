services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      # Mount the IS3 files into the container.
      # On the Hetzner server, upload the THERMAL/ folder and set THERMAL_DIR:
      #   THERMAL_DIR=/path/to/THERMAL docker compose up -d
      - type: bind
        source: ${THERMAL_DIR:-/data/thermal}
        target: /data/thermal
        read_only: true
    restart: unless-stopped
    # not exposed publicly — Nginx reaches it on the internal network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
